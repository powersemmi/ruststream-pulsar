[package]
name = "ruststream-pulsar"
description = "Apache Pulsar broker implementation for the RustStream messaging framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["pulsar", "messaging", "streaming", "broker", "ruststream"]
categories = ["asynchronous", "network-programming"]

# The crate root is the guide now, and it sends readers to the testing module and to the
# generated document; a default build on docs.rs carries no feature at all, so both would
# be missing from the published reference.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = []
# The broker's in-process mode: `TestApp::start` connects `PulsarBroker` without a server. A
# service enables it in its dev-dependencies. The conformance harness is a broker-author tool and
# stays in this repo's dev-dependencies, not in the user-facing feature.
testing = ["ruststream/testing", "dep:url"]
# The protocol bindings this crate contributes to the generated AsyncAPI document. Forwarded
# from the core, because the hooks that carry them live behind the core's own feature.
asyncapi = ["ruststream/asyncapi", "dep:serde"]

[dependencies]
ruststream = { workspace = true, default-features = false }
pulsar.workspace = true
regex.workspace = true
url = { workspace = true, optional = true }
bytes.workspace = true
futures.workspace = true
# Only the binding bodies are serialized here; the payload codecs are the core's.
serde = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# `cbor` is a second codec for the tests alone: a publish that names a per-message setting has to
# leave in the format its mount site named, and one codec cannot tell that apart from the default.
# `asyncapi` because the examples' manual twins derive `JsonSchema` for the message types their
# registrations document, as a service on the manual path does.
ruststream = { workspace = true, features = [
    "asyncapi",
    "cbor",
    "conformance",
    "testing",
    "macros",
    "json",
] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

