[workspace]
resolver = "3"
members = ["crates/ruststream-pulsar"]

[workspace.package]
version = "0.7.0"
edition = "2024"
# The floor the core crate declares on the 0.7 line; a lower one cannot resolve it.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-pulsar"
authors = ["RustStream contributors"]

[workspace.dependencies]
ruststream-pulsar = { path = "crates/ruststream-pulsar" }

# Naming the pre-release admits the 0.7.0 release candidate: a range whose bounds carry no
# pre-release tag excludes every pre-release, so ">=0.7.0" alone cannot resolve 0.7.0-rc.3.
# The floor is rc.3: a publisher declares its per-message options there, and a subscription
# reports the address a deferred retry is published to.
ruststream = { version = ">=0.7.0-rc.3, <0.8.0", default-features = false }

# The client's default features drag in async-std, OAuth2, and mutually exclusive TLS
# runtimes; pin the tokio runtime and the wire compressors (foreign producers may compress).
pulsar = { version = "6.8", default-features = false, features = ["tokio-runtime", "compression"] }
regex = "1"
bytes = "1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
