name: CI

on:
  push:
    branches: [main]
  # No base filter: a pull request stacked on another one has a branch for its base, and a filter
  # naming `main` leaves it with no checks at all - which reads as a conflicting branch rather
  # than as a workflow that declined to run.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Build and test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, what users build with, and the early warning. Releases in between add
        # nothing: what fails on a later one fails on the floor too. Keep the floor in step
        # with `rust-version` in the workspace manifest.
        toolchain: [stable, beta, "1.88"]
    # Installing a toolchain does not select it: `rust-toolchain.toml` outranks the rustup
    # default the install action sets. RUSTUP_TOOLCHAIN outranks the file.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The client's build script compiles PulsarApi.proto.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Advisory, not a gate: surfaces a lint added by the next clippy release six weeks
      # before it turns the build red.
      - name: cargo clippy (beta, advisory)
        if: matrix.toolchain == 'beta'
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check (no default features)
        run: cargo check --workspace --no-default-features

      - name: cargo check (all features)
        run: cargo check --workspace --all-targets --all-features

      # --no-fail-fast: a failing target must not hide failures in the targets behind it;
      # the log then lists every red test, not just the first binary's.
      - name: cargo test (handler-stub only, no live broker)
        run: cargo test --workspace --all-features --no-fail-fast

      # The crate-root missing_docs deny covers item docs; this gate catches what rustc
      # cannot: broken intra-doc links and redundant targets only rustdoc resolves.
      - name: cargo doc
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  features:
    name: Each feature alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The client's build script compiles PulsarApi.proto.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-hack

      # --no-dev-deps: the dev-dependency on `ruststream` turns on `testing` (and the codec and
      # macro features) for the whole graph, so with dev-deps in scope a `testing` item the
      # library reaches for without gating it still compiles. Dropping them is what makes the
      # per-feature build actually test the gates.
      - name: cargo hack check (each feature)
        run: cargo hack check --workspace --each-feature --no-dev-deps

  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The client's build script compiles PulsarApi.proto.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly (resolver only)
        uses: dtolnay/rust-toolchain@nightly

      # The floor, for the build step below. Keep the version in step with
      # `rust-version` in the workspace manifest.
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The full flag rather than -Z direct-minimal-versions: the narrow one leaves the assembled
      # graph unverified, and that is what a user builds. It costs the pinning list below.
      - name: Resolve minimal versions
        run: cargo +nightly update -Z minimal-versions

      # Each of these is a bound a dependency declares more loosely than the code behind it
      # actually needs, so the minimal resolution picks a version that does not compile. Drop
      # an entry when the crate that owns the bound moves its own floor. A bound this repo
      # declares is fixed in the manifest instead of pinned here.
      #
      # getrandom 0.1.7 declares `cfg-if = "0.1"` but its `cfg_if!` chain ends without a
      # trailing `else`, which cfg-if only parses from 0.1.2. Reached through the client's
      # build dependency on prost-build -> tempfile -> rand 0.7.
      #
      # native-tls 0.2.12 declares `openssl = "0.10.29"` but calls `Pkcs12::parse2`, added in
      # 0.10.46. Pinning openssl rather than openssl-sys is deliberate: openssl 0.10.29 does
      # not compile against any openssl-sys new enough for the runners' OpenSSL 3.x, so the
      # pin has to land on the crate whose bound is wrong.
      - name: Pin dependencies whose declared bounds are too loose
        run: |
          cargo update -p cfg-if@0.1.0 --precise 0.1.2
          cargo update -p openssl --precise 0.10.46

      # Minimum dependencies on the minimum compiler: the worst case a user can assemble.
      # Resolution above needs nightly, so only this step drops to the floor. --locked here
      # only: the two steps above are what produced this lock file, and re-resolving would
      # undo the very thing this job verifies.
      - name: Build and test against minimal versions
        env:
          RUSTUP_TOOLCHAIN: "1.88"
        run: |
          cargo check --locked --workspace --all-targets --all-features
          cargo test --locked --workspace --all-features --no-fail-fast

  broker-integration:
    name: Broker integration (Pulsar standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The client's build script compiles PulsarApi.proto.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Start Pulsar standalone
        run: |
          docker run -d --name pulsar \
            -p 127.0.0.1:6650:6650 \
            -p 127.0.0.1:8080:8080 \
            -e PULSAR_PREFIX_advertisedAddress=127.0.0.1 \
            -e PULSAR_PREFIX_advertisedListeners=pulsar://127.0.0.1:6650 \
            apachepulsar/pulsar:4.1.2 \
            bin/pulsar standalone

      - name: Wait for Pulsar
        timeout-minutes: 4
        run: |
          timeout 210 bash -c 'until curl -fsS http://127.0.0.1:8080/admin/v2/brokers/health >/dev/null 2>&1; do sleep 2; done'
          curl -fsS http://127.0.0.1:8080/admin/v2/brokers/health

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run integration + conformance against Pulsar
        env:
          PULSAR_TEST_URL: pulsar://127.0.0.1:6650
        run: >-
          cargo test -p ruststream-pulsar --all-features
          --test integration_pulsar
          --test conformance_pulsar
          -- --test-threads=1

      - name: Cleanup
        if: always()
        run: docker rm -f pulsar

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate
      # versions, and registry sources, per the checked-in deny.toml. Not path-
      # gated: advisories arrive over time, not only with manifest changes.
      - name: cargo deny
        run: cargo deny check

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: codespell
        run: uvx codespell

      - name: zizmor
        run: uvx zizmor .github/workflows
